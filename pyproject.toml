[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-native-t3d"
version = "0.2.0"
description = "Transformer-Native 3D: AI Pipeline from Raw 3D Models to Polished, Rigged, and Textured Game-Ready Assets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["3d", "retopology", "rigging", "pbr", "game-ready", "mesh", "voxel", "glb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fast-simplification>=0.2.0",
    "hilbertcurve>=2,<3",
    "trimesh>=4,<5",
    "Pillow>=10",
    "torch>=2.0",
    "transformers>=4.30"
]

[project.scripts]
t3d = "t3d.cli:main"
t3d-generate = "t3d.generate:main"
t3d-export = "t3d.export:main"

[project.optional-dependencies]
research = ["fast-simplification==0.2.0"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-subtests>=0.12"]

[tool.setuptools.packages.find]
include = ["t3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
