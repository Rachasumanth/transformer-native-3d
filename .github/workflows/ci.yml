name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[service]"
          python -m pip install pytest pytest-subtests
      - name: Compile
        run: python -m compileall -q t3d tools
      - name: Doctor Preflight
        run: PYTHONPATH=. python -m t3d.cli doctor --no-verify
      - name: Test
        run: PYTHONPATH=. python -m pytest -q
      - name: Dual Production Canary Verification
        run: PYTHONPATH=. python tools/run_canary_gates.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: t3d:latest
