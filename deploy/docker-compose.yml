services:
  t3d:
    build:
      context: ..
      dockerfile: Dockerfile
    image: t3d:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      T3D_ARTIFACTS: /models
      T3D_DEVICE: cpu
      T3D_API_KEY: ${T3D_API_KEY:-}
      T3D_ENABLE_MATERIAL: ${T3D_ENABLE_MATERIAL:-0}
      HF_HOME: /cache/huggingface
    volumes:
      - ../artifacts:/models:ro
      - t3d-hf-cache:/cache/huggingface
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  t3d-hf-cache:
